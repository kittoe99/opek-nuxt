<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radial" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-40" y="-40" width="1040" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="720" fill="#020617" />
  <rect width="960" height="720" fill="url(#haze)" opacity="0.9" />

  <g opacity="0.3">
    <circle cx="140" cy="120" r="120" fill="#10B981" />
    <circle cx="860" cy="200" r="140" fill="#22D3EE" />
    <circle cx="220" cy="640" r="170" fill="#A855F7" />
    <circle cx="760" cy="580" r="110" fill="#22C55E" />
  </g>

  <g filter="url(#glow)">
    <circle cx="480" cy="360" r="280" fill="url(#radial)" />
    <circle cx="480" cy="360" r="205" stroke="#ECFDF5" stroke-width="2" stroke-dasharray="14 16" opacity="0.65" />
    <circle cx="480" cy="360" r="135" stroke="#BBF7D0" stroke-width="2" stroke-dasharray="10 12" opacity="0.6" />
  </g>

  <g fill="#ECFDF5" font-family="'Inter', 'Segoe UI', sans-serif">
    <text x="470" y="356" font-size="30" font-weight="700" text-anchor="middle">DEN</text>
    <text x="640" y="300" font-size="18" font-weight="600">Thornton</text>
    <text x="320" y="500" font-size="18" font-weight="600">Lakewood</text>
    <text x="600" y="520" font-size="18" font-weight="600">Aurora</text>
    <text x="420" y="250" font-size="18" font-weight="600">Boulder</text>
    <text x="280" y="320" font-size="18" font-weight="600">Arvada</text>
    <text x="680" y="430" font-size="18" font-weight="600">Centennial</text>
  </g>

  <g stroke="#F8FAFC" stroke-opacity="0.5" stroke-width="1.2">
    <path d="M480 130C585 180 650 260 700 365" />
    <path d="M480 130C390 180 320 250 280 340" />
    <path d="M700 365C660 470 575 555 480 590" />
    <path d="M280 340C320 450 395 540 480 590" />
  </g>

  <g>
    <circle cx="480" cy="360" r="9" fill="#FDE68A" stroke="#FACC15" stroke-width="3" />
    <circle cx="640" cy="300" r="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="2" />
    <circle cx="320" cy="500" r="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="2" />
    <circle cx="600" cy="520" r="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="2" />
    <circle cx="420" cy="250" r="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="2" />
    <circle cx="280" cy="320" r="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="2" />
    <circle cx="680" cy="430" r="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="2" />
  </g>

  <rect x="60" y="560" width="280" height="110" rx="24" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5" />
  <text x="90" y="600" fill="#F8FAFC" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="700">Greater Denver Coverage</text>
  <text x="90" y="632" fill="#E2E8F0" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16">Same-day crews across 50-mile radius</text>
